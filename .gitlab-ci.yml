# Merge request pipelines. The Linux checks run on this project's runner; what needs GitHub's runners (Windows, and
# Miri, which is not worth this machine's cores) runs there through the template's job, which waits for the run and
# reports its result. A merge request needs this pipeline to succeed: it replaces the `ci-ok` check of ci.yml.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

include:
  - project: euhedral/ci
    ref: v2
    file: github-actions-proxy.yml
    inputs:
      ref: v2

variables:
  # Compare with the merge request's target as a pull request is compared; the same for the jobs below.
  BASE: origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME

# The workflows and the pipeline file: syntax, expressions, shell steps.
workflows:
  interruptible: true
  timeout: 10m
  variables:
    ARBITER_ARGS: "--cpu shared:2 --mem 2G"
    ARBITER_EST: "120"
  script:
    - mise exec actionlint@1.7.12 -- actionlint .github/workflows/*.yml

# The `workspace` job of .github/workflows/ci.yml on Ubuntu (scripts/ci/linux.sh).
linux:
  interruptible: true
  timeout: 1h
  variables:
    GIT_DEPTH: "0"
    ARBITER_ARGS: "--cpu shared:16 --mem 16G"
    ARBITER_EST: "900"
    # euhedral-io's tests open io_uring, which Docker's default seccomp profile refuses: the runner's narrow profile allows it.
    CI_SECCOMP: io-uring
    CARGO_TARGET_DIR: /cache/rustee-target
    CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  before_script:
    # This job runs the merge request's own code: the GitHub App's key must not be in its environment.
    - |
      for name in GITHUB_APP_ID GITHUB_APP_INSTALLATION_ID GITHUB_APP_PRIVATE_KEY; do
        if printenv "$name" > /dev/null; then echo "$name is set in this job"; exit 1; fi
      done
    - git fetch --quiet origin "+refs/heads/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}:refs/remotes/origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
    - mise install
  script:
    - scripts/ci/linux.sh "$BASE"

# The `workspace` job of ci.yml on Windows, run by GitHub Actions on the crates the change affects.
windows:
  extends: .github-actions-proxy
  variables:
    PROXY_REPO: Euhedral-Engine/RustEE
    PROXY_WORKFLOW: ci.yml
    # The branch carries the merge request's changes to workflow files, which a push is only allowed to make with this.
    PROXY_PERMISSIONS: contents:write,actions:write,workflows:write
    PROXY_INPUTS: |
      only_os=windows-2025
      base_ref=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    # A change to documentation alone affects no crate, and ci.yml then skips every job: nothing to run.
    PROXY_SKIP_IF: >-
      git fetch --quiet origin "+refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/remotes/$BASE" &&
      mise exec -- python3 scripts/ci/affected.py --base "$BASE" --head HEAD --merge-base | grep -qx 'any=false'

# Miri, on GitHub: the shards of the affected crates, and the canary.
miri:
  extends: .github-actions-proxy
  variables:
    PROXY_REPO: Euhedral-Engine/RustEE
    PROXY_WORKFLOW: ci.yml
    # The branch carries the merge request's changes to workflow files, which a push is only allowed to make with this.
    PROXY_PERMISSIONS: contents:write,actions:write,workflows:write
    PROXY_INPUTS: |
      miri_only=true
      base_ref=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    PROXY_SKIP_IF: >-
      git fetch --quiet origin "+refs/heads/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:refs/remotes/$BASE" &&
      mise exec -- python3 scripts/ci/affected.py --base "$BASE" --head HEAD --merge-base | grep -qx 'miri=false'
