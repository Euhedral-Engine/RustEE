# GitLab twin of .github/workflows/ci.yml (Linux only): scripts/ci/affected.py picks the crates a change affects,
# scripts/ci/gitlab_pipeline.py turns that into a child pipeline. Jobs run in the arbiter-gated runner; ARBITER_ARGS
# sets the lease. The toolchain is the one pinned in mise.toml. Windows is the one thing this runner cannot do: the
# `windows` job has GitHub's runner do it and waits for the result (the template of the project euhedral/ci).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch with an open merge request already has a merge request pipeline: no second one for a push.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

include:
  - project: euhedral/ci
    ref: v2
    file: github-actions-proxy.yml
    inputs:
      ref: v2

variables:
  GIT_DEPTH: "0"

stages: [plan, run]

plan:
  stage: plan
  variables: { ARBITER_ARGS: "--cpu shared:2" }
  before_script:
    # This job runs the merge request's own code: the GitHub App's key must not be in its environment (the variables
    # belong to the environment `github-proxy`, which only the `windows` job declares).
    - |
      for name in GITHUB_APP_ID GITHUB_APP_INSTALLATION_ID GITHUB_APP_PRIVATE_KEY; do
        if printenv "$name" > /dev/null; then echo "$name is set in this job"; exit 1; fi
      done
  script:
    - mise install rust >/dev/null && eval "$(mise env -s bash)"
    - python3 scripts/ci/test_affected.py
    - python3 scripts/ci/test_miri_build.py
    - python3 scripts/ci/test_gitlab_pipeline.py
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        git fetch -q origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        args="--base origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME --head HEAD --merge-base"
      elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ] && [ "${CI_COMMIT_BEFORE_SHA#0000}" = "$CI_COMMIT_BEFORE_SHA" ]; then
        args="--base $CI_COMMIT_BEFORE_SHA --head HEAD"
      else
        git fetch -q origin "$CI_DEFAULT_BRANCH"
        args="--base origin/$CI_DEFAULT_BRANCH --head HEAD --merge-base"
      fi
      [ -n "$FORCE_ALL" ] && args="--all"
      python3 scripts/ci/affected.py $args | tee affected.txt
    - python3 scripts/ci/gitlab_pipeline.py < affected.txt > child.yml
  artifacts:
    paths: [child.yml, affected.txt]

# The workflows and the pipeline file: syntax, expressions, shell steps.
workflows:
  stage: plan
  interruptible: true
  timeout: 10m
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables: { ARBITER_ARGS: "--cpu shared:2 --mem 2G", ARBITER_EST: "120" }
  script:
    - mise exec actionlint@1.7.12 -- actionlint .github/workflows/*.yml

run:
  stage: run
  needs: [plan]
  trigger:
    include:
      - artifact: child.yml
        job: plan
    strategy: depend

# The `workspace` job of .github/workflows/ci.yml on Windows, run by GitHub Actions on the crates the change affects.
# It sits in this pipeline, beside `run`, because it needs the merge request's variables and the environment that holds
# the App's key, and it follows the same decision as the child pipeline: plan's affected.txt (nothing affected: skipped).
windows:
  extends: .github-actions-proxy
  stage: run
  needs: [plan]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    PROXY_REPO: Euhedral-Engine/RustEE
    PROXY_WORKFLOW: ci.yml
    # The branch carries the merge request's changes to workflow files, which a push is only allowed to make with this.
    PROXY_PERMISSIONS: contents:write,actions:write,workflows:write
    PROXY_INPUTS: |
      only_os=windows-2025
      base_ref=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    PROXY_SKIP_IF: grep -qx 'any=false' affected.txt
