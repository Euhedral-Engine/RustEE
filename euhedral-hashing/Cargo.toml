[package]
name = "euhedral-hashing"
version = "0.1.0"
edition = "2024"
description = "xxHash64-based hashing for Euhedral routing keys and vectors"
readme = "README.md"
license = "Apache-2.0"
# The test checks the workspace's pin files, so it is not shipped with the crate.
exclude = ["tests/toolchain_pin.rs"]

[dependencies]

# Bazel-only settings, which Cargo ignores (docs/design/bazel.md): the toolchain pin test reads the files that pin the
# Rust version. It lives here, in a crate with no dependencies, because the shared generator has no test for it.
[package.metadata.bazel.test.toolchain_pin]
data = ["//:MODULE.bazel", "//:mise.toml", "//:rust-toolchain.toml"]
