# RustEE's configuration of the shared BUILD generator, @euhedral_build//bazel-gen (docs/design/bazel.md). `bazel run
# //:gazelle` writes every BUILD.bazel from the Cargo manifests; `bazel test //...` runs the stale check.
header = "# @generated by the shared bazel-gen (@euhedral_build//bazel-gen) from the Cargo manifests; do not edit. Regenerate with `bazel run //:gazelle`."

[root]
exports = ["Cargo.lock", "Cargo.toml", "MODULE.bazel", "mise.toml", "rust-toolchain.toml"]
# crate_universe's own lock (MODULE.bazel's `lockfile`): the stale test compares it with Cargo.lock in both directions.
crate_lock = "cargo-bazel-lock.json"

# euhedral-memory's `cuda` loads the CUDA driver: a test whose graph has it is tagged `gpu` and `external`.
[device]
member = "euhedral-memory"
feature = "cuda"
