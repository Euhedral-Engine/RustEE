# The labels of the project's own runners, used by .gitea/workflows/ci.yml. Without them actionlint rejects a `runs-on`
# that is not one of GitHub's.
self-hosted-runner:
  labels:
    - arbiter-docker
    - arbiter-docker-unconfined
    - arbiter-gpu

# Gitea's artifact backend takes the v3 actions, which actionlint flags as too old for GitHub, and a `uses` with a full
# URL is how Gitea reaches an action in its own instance. Only these two messages, only in Gitea's workflow.
paths:
  .gitea/workflows/*.yml:
    ignore:
      - 'the runner of "actions/(upload|download)-artifact@v3" action is too old'
      - 'specifying action "http://localhost:8929/[^"]*" in invalid format'
