# Builds and tests the whole workspace on Linux and Windows: formatting, Clippy with warnings as
# errors, and every crate's tests and doctests. The toolchain is the one pinned in mise.toml.
# windows-2025 is Windows Server 2025 (build 26100), which has IoRing, so euhedral-io's
# Windows engine runs on its kernel ring there (each of its tests also runs forced onto the
# completion port).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain pinned in mise.toml
        shell: bash
        run: |
          version=$(sed -n 's/^rust = .*version = "\([^"]*\)".*/\1/p' mise.toml)
          rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
          rustup default "$version"
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Source-invariant stress tests in release (the memory orderings are tested optimised)
        run: |
          cargo test --release -p euhedral-core --lib flow_control::vertex
          cargo test --release -p euhedral-core --lib generics::
          cargo test --release -p euhedral-core --lib ingest::
          cargo test --release -p euhedral-core --lib flow_control::hot_source
          cargo test --release -p euhedral-core --lib utils::stop_watch
          cargo test --release -p euhedral-core --lib flow_control::edge
          cargo test --release -p euhedral-core --lib control_plane::cache
          cargo test --release -p euhedral-core --lib flow_control::views
          cargo test --release -p euhedral-graph --lib completions::

      - name: Loom models
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: --cfg loom
        run: |
          cargo test -p euhedral-data-structures --release --lib sync::set_once::loom
          cargo test -p euhedral-data-structures --release --lib sync::claim_cell::loom

      - name: CUDA backend (built and linted; its tests skip with no device)
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p euhedral-memory --all-targets --features cuda -- -D warnings
          cargo clippy -p euhedral-gpu --all-targets --features cuda -- -D warnings
          cargo test -p euhedral-gpu --features cuda

  # The lock-free sources' handshakes (a claim, a wakeup flag, a re-check after release) under Miri's weak-memory
  # emulation with several seeds. The tests scale their rounds down under `cfg(miri)`.
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MIRIFLAGS: -Zmiri-many-seeds=0..16 -Zmiri-ignore-leaks
    steps:
      - uses: actions/checkout@v4

      - name: Install a nightly toolchain with Miri
        run: |
          rustup toolchain install nightly --profile minimal --component miri --component rust-src
          cargo +nightly miri setup

      - name: Claims, ingest sources, completions
        run: |
          cargo +nightly miri test -p euhedral-data-structures --lib sync::claim_cell
          cargo +nightly miri test -p euhedral-core --lib ingest::single_use
          cargo +nightly miri test -p euhedral-core --lib -- metrics::histogram::tests::an_owner metrics::histogram::tests::a_reader
          cargo +nightly miri test -p euhedral-core --lib -- ingest::queue::tests::a_request_while ingest::queue::tests::a_request_refused ingest::queue::tests::request_pushes ingest::queue::tests::a_source_driven ingest::queue::tests::a_publish_after ingest::queue::tests::clear_racing ingest::queue::tests::a_panicking ingest::queue::tests::concurrent_publishers ingest::queue::tests::frames_queued
          cargo +nightly miri test -p euhedral-graph --lib -- completions::tests::registrations_racing completions::tests::a_request_while completions::tests::a_sweep_that completions::tests::a_consumer_that completions::tests::a_panicking completions::tests::a_late_registration completions::tests::a_marker_registration completions::tests::dropping_

      - name: Hot source, stop watch, body cost
        run: |
          cargo +nightly miri test -p euhedral-core --lib -- flow_control::hot_source utils::stop_watch control_plane::decision_tree::tests::the_estimate control_plane::decision_tree::tests::recalibrating

      - name: Cells and views, routing generations, vertex and edge races
        run: |
          cargo +nightly miri test -p euhedral-core --lib -- flow_control::views
          cargo +nightly miri test -p euhedral-core --lib -- flow_control::vertex::tests::pushes_racing flow_control::vertex::tests::the_last_reader flow_control::vertex::tests::a_panicking_routing_function flow_control::vertex::tests::close_retirements flow_control::edge::tests::close_while_pushing flow_control::edge::tests::a_closed_edge_refuses flow_control::edge::tests::a_receiver_refused flow_control::edge::tests::attaches_racing flow_control::edge::tests::racing_attaches flow_control::edge::tests::pushes_and_set_parent
