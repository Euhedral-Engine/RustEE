# Builds and tests the whole workspace on Linux and Windows: formatting, Clippy with warnings as
# errors, and every crate's tests and doctests. The toolchain is the one pinned in mise.toml.
# windows-2025 is Windows Server 2025 (build 26100), which has IoRing, so euhedral-io's
# Windows engine runs on its kernel ring there (each of its tests also runs forced onto the
# completion port).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain pinned in mise.toml
        shell: bash
        run: |
          version=$(sed -n 's/^rust = .*version = "\([^"]*\)".*/\1/p' mise.toml)
          rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
          rustup default "$version"
          rustc --version
          cargo --version

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Source-invariant stress tests in release (the memory orderings are tested optimised)
        run: |
          cargo test --release -p euhedral-core --lib flow_control::vertex
          cargo test --release -p euhedral-core --lib generics::

      - name: Loom models
        if: runner.os == 'Linux'
        env:
          RUSTFLAGS: --cfg loom
        run: cargo test -p euhedral-data-structures --release --lib sync::set_once::loom

      - name: CUDA backend (built and linted; its tests skip with no device)
        if: runner.os == 'Linux'
        run: |
          cargo clippy -p euhedral-gpu --all-targets --features cuda -- -D warnings
          cargo test -p euhedral-gpu --features cuda
