[package]
name = "euhedral-core"
version = "0.1.0"
edition = "2024"
description = "Frames, frame pools and pipelines executed by the Euhedral control plane"
readme = "README.md"
license = "Apache-2.0"

[dependencies]
euhedral-data-structures = { path = "../euhedral-data-structures" }
euhedral-hardware-utils = { path = "../euhedral-hardware-utils" }
euhedral-hashing = { path = "../euhedral-hashing" }
log = "0.4.29"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

# Bazel-only settings, which Cargo ignores (tools/bazel-gen/README.md): the ratchet reads every member's sources.
[package.metadata.bazel.test.hot_fix_ratchet]
workspace_sources = true
