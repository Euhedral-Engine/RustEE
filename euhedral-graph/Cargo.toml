[package]
name = "euhedral-graph"
version = "0.1.0"
edition = "2024"
description = "No-wait dataflow on the Euhedral control plane: completions, async I/O, sequencing, joins, device lanes and stage graphs"
readme = "README.md"

[features]
default = ["async-io"]
# `AsyncIo`: io_uring on Linux and Android; IoRing and I/O completion ports on Windows. Without it, or
# on another platform, the crate has no `io` module.
async-io = ["dep:io-uring", "dep:windows-sys"]
# `testing::FakeDevice`: an in-order fake device queue, for tests of code built on this crate.
testing = []

[dependencies]
euhedral-core = { path = "../euhedral-core" }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2.174"
io-uring = { version = "=0.7.15", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[dev-dependencies]
# The crate's own integration tests and unit tests use the fake device.
euhedral-graph = { path = ".", default-features = false, features = ["testing"] }
# The credit-graph test checks the CPUs this process may run on.
euhedral-hardware-utils = { path = "../euhedral-hardware-utils" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
