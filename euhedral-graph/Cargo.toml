[package]
name = "euhedral-graph"
version = "0.1.0"
edition = "2024"
description = "No-wait dataflow on the Euhedral control plane: completions, sequencing, device lanes and stage graphs"
readme = "README.md"
license = "Apache-2.0"

[features]
# `testing::FakeDevice`: an in-order fake device queue, for tests of code built on this crate.
testing = []

[dependencies]
euhedral-core = { path = "../euhedral-core" }
# `MpscQueue`: any thread registers, the polling thread drains.
euhedral-data-structures = { path = "../euhedral-data-structures" }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2.174"

[dev-dependencies]
# The crate's own integration tests and unit tests use the fake device.
euhedral-graph = { path = ".", default-features = false, features = ["testing"] }
# The credit-graph test checks the CPUs this process may run on.
euhedral-hardware-utils = { path = "../euhedral-hardware-utils" }
# The lake tests hash their lane ids as real ids are hashed.
euhedral-hashing = { path = "../euhedral-hashing" }

# The model checker behind `--cfg loom` (`RUSTFLAGS="--cfg loom" cargo test -p euhedral-graph --release --lib sequencer::loom`).
# A build without that flag never sees it. It is a regular dependency because the library's own atomics are
# what the model swaps, and the crate's self dev-dependency below builds the library without dev-dependencies.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
missing_debug_implementations = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
dbg_macro = "warn"
todo = "warn"
